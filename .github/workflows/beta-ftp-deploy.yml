name: Beta Deploy to cPanel

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - v2

jobs:
  deploy:
    name: Build & FTP Sync
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: '20'

      - name: ⬇️ Install dependencies
        run: npm ci

      - name: 🛠️ Build Next.js application
        env:
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
        run: npm run build
      
      - name: 📂 FTP Sync
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -e "
            set ftp:ssl-allow no;
            open ${{ secrets.BETA_FTP_SERVER }};
            user ${{ secrets.BETA_FTP_USERNAME }} ${{ secrets.BETA_FTP_PASSWORD }};
            mirror -R --verbose --parallel=10 --use-cache --exclude-glob=docs/** --exclude-glob=images/** ./out/ .
            bye
          "
        
